<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540" style="background:#0F172A; font-family:'Paperlogy', 'Pretendard', sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <!-- Subtle decorative grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="960" y2="135"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="405" x2="960" y2="405"/>
    <line x1="240" y1="0" x2="240" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="720" y1="0" x2="720" y2="540"/>
  </g>
  
  <g transform="translate(80, 85)">
    <rect x="0" y="0" width="350" height="28" rx="14" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-width="1.2"/>
    <text x="175" y="18" fill="#FBBF24" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">✦ MATHEMATICS &amp; DYNAMIC VISUALIZATION ✦</text>
    
    <text x="0" y="75" fill="#F8FAFC" font-size="34" font-weight="800">수학의 본질을 꿰뚫는</text>
    <text x="0" y="122" fill="#38BDF8" font-size="34" font-weight="800">LaTeX 수식 &amp; 동적 그래프 시뮬레이션</text>
    <text x="0" y="165" fill="#94A3B8" font-size="15" font-weight="500">수학교사를 위한 인터랙티브 시각화, 마우스 &amp; 키보드 조절 파라미터 수업 설계</text>
    
    <!-- Hero Box -->
    <g transform="translate(0, 200)" filter="url(#cardShadow)">
      <rect width="800" height="100" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.8"/>
      <circle cx="48" cy="50" r="22" fill="#38BDF8" fill-opacity="0.15"/>
      <text x="48" y="57" fill="#38BDF8" font-size="20" text-anchor="middle">📐</text>
      <text x="88" y="42" fill="#F8FAFC" font-size="16" font-weight="700">원클릭 인터랙티브 수학 교육 플랫폼</text>
      <text x="88" y="68" fill="#94A3B8" font-size="13">⚡ 마우스 클릭 진행  |  📈 고해상도 함수 그래프  |  🎛️ 상단 [Live Math Lab] 탭으로 실시간 조작</text>
    </g>
    
    <!-- Footer features -->
    <g transform="translate(0, 325)">
      <rect width="250" height="44" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="125" y="27" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">① 이차함수 포물선 &amp; 판별식</text>
      
      <rect x="275" y="0" width="250" height="44" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="400" y="27" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">② 삼각함수 파동 &amp; 푸리에 변환</text>
      
      <rect x="550" y="0" width="250" height="44" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="675" y="27" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">③ 미분 접선 &amp; 리만합 정적분</text>
    </g>
  </g>

</svg>